name: Build and release extension

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate release version
        id: version
        env:
          TAG_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail

          tag_version="${TAG_NAME#v}"
          manifest_version="$(python -c 'import json; print(json.load(open("manifest.json"))["version"])')"

          if [[ "$TAG_NAME" == "$tag_version" || ! "$tag_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags must use the format v1.2.3, received: $TAG_NAME" >&2
            exit 1
          fi

          if [[ "$tag_version" != "$manifest_version" ]]; then
            echo "Tag version ($tag_version) does not match manifest version ($manifest_version)." >&2
            exit 1
          fi

          echo "version=$tag_version" >> "$GITHUB_OUTPUT"

      - name: Build extension ZIP
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist
          zip_path="dist/MoreAskAI-v${VERSION}.zip"

          zip -r "$zip_path" \
            manifest.json \
            _locales \
            chrome \
            shared

          python - "$zip_path" <<'PY'
          import sys
          import zipfile

          archive_path = sys.argv[1]
          with zipfile.ZipFile(archive_path) as archive:
              names = set(archive.namelist())
              if "manifest.json" not in names:
                  raise SystemExit("manifest.json must be at the ZIP root")
          PY

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$TAG_NAME" "dist/MoreAskAI-v${VERSION}.zip" \
            --title "MoreAskAI ${VERSION}" \
            --generate-notes
